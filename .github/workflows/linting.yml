name: Linting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up environment
      uses: pnpm/setup@v3
      with:
        require-lockfile: true
        cache: true

    - name: Run ESLint
      run: pnpm lint
